name: Build, Publish, and Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pypi:
    name: Build & Publish PyPI Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Upload PyPI distribution to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true

  build-executables:
    name: Build Executable (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            name: lugach-windows-x86_64
          - os: macos-13
            target: macos-x86_64
            name: lugach-macos-x86_64
          - os: macos-latest
            target: macos-arm64
            name: lugach-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --dev

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --name ${{ matrix.name }} --onefile --collect-submodules lugach --collect-all playwright src/lugach/__main__.py

      - name: Build macOS executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          uv run pyinstaller --name ${{ matrix.name }} --onefile --collect-submodules lugach --collect-all playwright src/lugach/__main__.py
          chmod +x dist/${{ matrix.name }}
          tar -czvf dist/${{ matrix.name }}.tar.gz -C dist ${{ matrix.name }}

      - name: Upload executable to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.name }}.exe
            dist/${{ matrix.name }}.tar.gz
          fail_on_unmatched_files: false
